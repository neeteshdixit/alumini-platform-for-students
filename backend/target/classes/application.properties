server.port=8080

# ==========================================
# POSTGRESQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/alumni_platform
spring.datasource.username=postgres
spring.datasource.password=Neet2006@
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE AUTO-TABLE GENERATION (MAGIC SETTING)
# ==========================================
# 'update' se Hibernate check karega ki table hai ya nahi.
# Nahi hogi toh khud banayega, naya column hoga toh khud add karega!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.com.alumniconnect=DEBUG